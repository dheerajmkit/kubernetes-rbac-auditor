apiVersion: v1
kind: ServiceAccount
metadata:
  name: acme-reader
  namespace: acme-web
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acme-secret-reader
  namespace: acme-web
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-reader-binding
  namespace: acme-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acme-secret-reader
subjects:
- kind: ServiceAccount
  name: acme-reader
  namespace: acme-web
